[package]
name = "opencode-model-config"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "opencode-model-config"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["default"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true