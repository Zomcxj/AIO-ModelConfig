[package]
name = "model-harbor"
version = "0.0.1"
edition = "2021"
build = "build.rs"

[[bin]]
name = "model-harbor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", features = ["default"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
raw-window-handle = "0.6"
serde_yaml_ng = "0.10.0"
ureq = { version = "2", default-features = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
]}
rfd = "0.15"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
